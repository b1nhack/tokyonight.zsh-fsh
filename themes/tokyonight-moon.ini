; tokyonight-moon.ini — Tokyo Night (moon) theme for Fast Syntax Highlighting
;
; Palette source: https://github.com/folke/tokyonight.nvim (style: moon)
; Colors are truecolor hex values. Exact rendering requires zsh >= 5.7 and a
; terminal with truecolor support; zsh falls back to the nearest 256-color
; entry otherwise.
;
; Apply with:  fast-theme XDG:tokyonight-moon

[base]
default          = #c8d3f5
unknown-token    = #ff757f,bold
commandseparator = #89ddff
redirection      = #89ddff
here-string-tri  = #89ddff
here-string-text = bg:#2f334d
here-string-var  = #ffc777,bg:#2f334d
exec-descriptor  = #ff966c,bold
comment          = #636da6
correct-subtle   = bg:#3e68d7
incorrect-subtle = bg:#4b2a3d
subtle-separator = #89ddff
subtle-bg        = bg:#2f334d
secondary        = zdharma
recursive-base   = #86e1fc

[command-point]
reserved-word  = #c099ff
subcommand     = #65bcff
alias          = #65bcff
suffix-alias   = #65bcff
global-alias   = #86e1fc,bg:#2f334d
builtin        = #65bcff
function       = #65bcff
command        = #82aaff
precommand     = #65bcff
hashed-command = #65bcff
single-sq-bracket = #82aaff
double-sq-bracket = #c099ff
double-paren   = #c099ff

[paths]
path          = #86e1fc
pathseparator =
path-to-dir   = #86e1fc,underline
globbing      = #c099ff,bold
globbing-ext  = #c099ff

[brackets]
paired-bracket  = bg:#3e68d7
bracket-level-1 = #82aaff,bold
bracket-level-2 = #ffc777,bold
bracket-level-3 = #c3e88d,bold

[arguments]
single-hyphen-option   = #86e1fc
double-hyphen-option   = #86e1fc
back-quoted-argument   = #65bcff
single-quoted-argument = #c3e88d
double-quoted-argument = #c3e88d
dollar-quoted-argument = #c3e88d

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #c099ff
; backslash or $... in "..." (i.e. variable inside a string)
back-or-dollar-double-quoted-argument = #c099ff

[other]
variable             = #ffc777
assign               = none
assign-array-bracket = #89ddff
history-expansion    = #ff966c,bold
optarg-string        = #c3e88d
optarg-number        = #ff966c

[math]
mathvar = #82aaff,bold
mathnum = #ff966c
matherr = #c53b53

[for-loop]
forvar  = #c8d3f5
fornum  = #ff966c
; operator
foroper = #c099ff
; separator
forsep  = #89ddff

[case]
case-input       = #ffc777
case-parentheses = #89ddff
case-condition   = bg:#2d3f76
