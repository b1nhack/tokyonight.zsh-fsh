; tokyonight-night.ini — Tokyo Night (night) theme for Fast Syntax Highlighting
;
; Palette source: https://github.com/folke/tokyonight.nvim (style: night)
; Colors are truecolor hex values. Exact rendering requires zsh >= 5.7 and a
; terminal with truecolor support; zsh falls back to the nearest 256-color
; entry otherwise.
;
; Apply with:  fast-theme XDG:tokyonight-night

[base]
default          = #c0caf5
unknown-token    = #f7768e,bold
commandseparator = #89ddff
redirection      = #89ddff
here-string-tri  = #89ddff
here-string-text = bg:#292e42
here-string-var  = #e0af68,bg:#292e42
exec-descriptor  = #ff9e64,bold
comment          = #565f89
correct-subtle   = bg:#3d59a1
incorrect-subtle = bg:#4a272f
subtle-separator = #89ddff
subtle-bg        = bg:#292e42
secondary        = zdharma
recursive-base   = #7dcfff

[command-point]
reserved-word  = #bb9af7
subcommand     = #2ac3de
alias          = #2ac3de
suffix-alias   = #2ac3de
global-alias   = #7dcfff,bg:#292e42
builtin        = #2ac3de
function       = #2ac3de
command        = #7aa2f7
precommand     = #2ac3de
hashed-command = #2ac3de
single-sq-bracket = #7aa2f7
double-sq-bracket = #bb9af7
double-paren   = #bb9af7

[paths]
path          = #7dcfff
pathseparator =
path-to-dir   = #7dcfff,underline
globbing      = #bb9af7,bold
globbing-ext  = #bb9af7

[brackets]
paired-bracket  = bg:#3d59a1
bracket-level-1 = #7aa2f7,bold
bracket-level-2 = #e0af68,bold
bracket-level-3 = #9ece6a,bold

[arguments]
single-hyphen-option   = #7dcfff
double-hyphen-option   = #7dcfff
back-quoted-argument   = #2ac3de
single-quoted-argument = #9ece6a
double-quoted-argument = #9ece6a
dollar-quoted-argument = #9ece6a

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #bb9af7
; backslash or $... in "..." (i.e. variable inside a string)
back-or-dollar-double-quoted-argument = #bb9af7

[other]
variable             = #e0af68
assign               = none
assign-array-bracket = #89ddff
history-expansion    = #ff9e64,bold
optarg-string        = #9ece6a
optarg-number        = #ff9e64

[math]
mathvar = #7aa2f7,bold
mathnum = #ff9e64
matherr = #db4b4b

[for-loop]
forvar  = #c0caf5
fornum  = #ff9e64
; operator
foroper = #bb9af7
; separator
forsep  = #89ddff

[case]
case-input       = #e0af68
case-parentheses = #89ddff
case-condition   = bg:#283457
