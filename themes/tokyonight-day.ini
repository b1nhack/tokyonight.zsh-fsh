; tokyonight-day.ini — Tokyo Night (day) theme for Fast Syntax Highlighting
;
; Palette source: https://github.com/folke/tokyonight.nvim (style: day)
; Colors are truecolor hex values. Exact rendering requires zsh >= 5.7 and a
; terminal with truecolor support; zsh falls back to the nearest 256-color
; entry otherwise.
;
; Apply with:  fast-theme XDG:tokyonight-day

[base]
default          = #3760bf
unknown-token    = #f52a65,bold
commandseparator = #006a83
redirection      = #006a83
here-string-tri  = #006a83
here-string-text = bg:#c4c8da
here-string-var  = #8c6c3e,bg:#c4c8da
exec-descriptor  = #b15c00,bold
comment          = #848cb5
correct-subtle   = bg:#7890dd
incorrect-subtle = bg:#dababe
subtle-separator = #006a83
subtle-bg        = bg:#c4c8da
secondary        = zdharma
recursive-base   = #007197

[command-point]
reserved-word  = #9854f1
subcommand     = #188092
alias          = #188092
suffix-alias   = #188092
global-alias   = #007197,bg:#c4c8da
builtin        = #188092
function       = #188092
command        = #2e7de9
precommand     = #188092
hashed-command = #188092
single-sq-bracket = #2e7de9
double-sq-bracket = #9854f1
double-paren   = #9854f1

[paths]
path          = #007197
pathseparator =
path-to-dir   = #007197,underline
globbing      = #9854f1,bold
globbing-ext  = #9854f1

[brackets]
paired-bracket  = bg:#7890dd
bracket-level-1 = #2e7de9,bold
bracket-level-2 = #8c6c3e,bold
bracket-level-3 = #587539,bold

[arguments]
single-hyphen-option   = #007197
double-hyphen-option   = #007197
back-quoted-argument   = #188092
single-quoted-argument = #587539
double-quoted-argument = #587539
dollar-quoted-argument = #587539

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #9854f1
; backslash or $... in "..." (i.e. variable inside a string)
back-or-dollar-double-quoted-argument = #9854f1

[other]
variable             = #8c6c3e
assign               = none
assign-array-bracket = #006a83
history-expansion    = #b15c00,bold
optarg-string        = #587539
optarg-number        = #b15c00

[math]
mathvar = #2e7de9,bold
mathnum = #b15c00
matherr = #c64343

[for-loop]
forvar  = #3760bf
fornum  = #b15c00
; operator
foroper = #9854f1
; separator
forsep  = #006a83

[case]
case-input       = #8c6c3e
case-parentheses = #006a83
case-condition   = bg:#b7c1e3
